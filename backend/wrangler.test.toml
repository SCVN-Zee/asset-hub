# Measurement Worker for the Rust build. It has its own name, so deploying it never replaces the
# live Worker. It has no cron triggers, so it never runs the sweep against shared data.
# Point the probe at it only with schema 998 of the probe repository (see scripts/cpu-probe.mjs).
# Invocation logs are persisted at full sampling for the measurement window.
name = "asset-hub-api-rust-test"
main = "build/worker/shim.mjs"
account_id = "15d0e54a256f69e39dbc0c1e1141b7c6"
compatibility_date = "2026-03-01"

[build]
command = 'cargo install -q worker-build@0.8.7 --locked && "$HOME/.cargo/bin/worker-build" --release'

[[d1_databases]]
binding = "DB"
database_name = "asset-hub"
database_id = "b3231772-34d6-4618-8011-6a8b2cf8a6cd"
migrations_dir = "migrations"

[[d1_databases]]
binding = "THUMBS_0"
database_name = "asset-hub-thumbs-0"
database_id = "1f776686-b2ea-4b7a-aa2b-33e8d680df73"
migrations_dir = "migrations-thumbs"

[[d1_databases]]
binding = "THUMBS_1"
database_name = "asset-hub-thumbs-1"
database_id = "67bec65d-dfe3-495e-8848-47db0e2d7e94"
migrations_dir = "migrations-thumbs"

[[d1_databases]]
binding = "THUMBS_2"
database_name = "asset-hub-thumbs-2"
database_id = "82788a4e-f61f-45ca-895e-e70cf7a44b34"
migrations_dir = "migrations-thumbs"

