[vars]
ALLOWED_OWNERS = "supercent-io,SCVN-Dan"
B2_ENDPOINT = "https://s3.us-west-004.backblazeb2.com"
B2_REGION = "us-west-004"
B2_BUCKET = "asset-hub-cache"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# Secrets UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN, B2_KEY_ID and B2_APP_KEY: `wrangler secret put`
# in production, `.dev.vars` (git-ignored) locally.
