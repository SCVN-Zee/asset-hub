[package]
name = "asset-hub-api"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Not a member of the root workspace: the desktop build must not see the Wasm dependencies.
[workspace]

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["ReadableStream", "ReadableStreamDefaultReader", "Blob", "Request", "RequestInit", "Response", "ResponseInit", "Headers", "AbortController", "AbortSignal"] }
wasm-bindgen-futures = "=0.4.80"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
serde-wasm-bindgen = "=0.6.5"
futures-util = "=0.3.34"
hmac = "=0.13.0"
sha2 = "=0.11.1"
ryu-js = "=1.0.3"
asset_hub_pack = { path = "../crates/pack" }

[dev-dependencies]
futures-executor = "=0.3.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
