[triggers]
crons = ["17 */3 * * *"]

# Secrets UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN, B2_KEY_ID and B2_APP_KEY: `wrangler secret put`
# in production, `.dev.vars` (git-ignored) locally.
