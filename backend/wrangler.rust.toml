# Do not deploy this file before the cutover phase. It uses the same Worker name as the live
# TypeScript Worker, so `wrangler deploy -c wrangler.rust.toml` would replace the live Worker.
# Build and test it only through the contract suite (`CONTRACT_TARGET=rust`) and `--dry-run`.
name = "asset-hub-api"
main = "build/worker/shim.mjs"
account_id = "15d0e54a256f69e39dbc0c1e1141b7c6"
compatibility_date = "2026-03-01"

[build]
command = 'cargo install -q worker-build@0.8.7 --locked && "$HOME/.cargo/bin/worker-build" --release'

[[d1_databases]]
binding = "DB"
database_name = "asset-hub"
database_id = "2bde477c-335b-44dc-b257-c10fbc8a4f25"
migrations_dir = "migrations"

[[d1_databases]]
binding = "THUMBS_0"
database_name = "asset-hub-thumbs-0"
database_id = "e1b5cafe-3112-49a1-9f15-a5834ab6a606"
migrations_dir = "migrations-thumbs"

[[d1_databases]]
binding = "THUMBS_1"
