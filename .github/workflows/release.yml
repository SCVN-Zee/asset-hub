name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # `bun run release` publishes the GitHub release to this repository.
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the tag, the version and the secrets
        run: |
          version="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          # The key password may be empty (a key made without one), so it is not checked here.
          for name in TAURI_SIGNING_PRIVATE_KEY HOMEBREW_TAP_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions, then run the release again."
              exit 1
            fi
          done

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Boots the bundled Luna runtime in headless Chrome. The runner image has Google Chrome; References/ is absent in CI, so the prefab cases skip.
      - name: Luna runtime smoke test
        run: bun scripts/luna-smoke.mjs
      - run: bun run prebuild:cli
      - run: cargo test --workspace

      - name: Build and publish the release
        run: bun run release

      - name: Update the Homebrew cask
        run: scripts/ci/bump-homebrew-cask.sh "${GITHUB_REF_NAME#v}" release/Asset.Hub.app.tar.gz
